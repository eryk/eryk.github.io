baseURL: "https://erykxu.com/"
languageCode: "zh-CN"
defaultContentLanguage: "zh"
title: "Eryk's Blog"
theme: "paper"
copyright: "© 2017–2026 Eryk"

hasCJKLanguage: true
enableEmoji: true
enableInlineShortcodes: true

buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

# 保持迁移前的文章 URL 不变。
permalinks:
  posts: /:year/:month/:day/:title/

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4

minify:
  disableXML: true
  minifyOutput: true

menu:
  main:
    - identifier: search
      name: 搜索
      url: /search/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: about
      name: 关于
      url: /about/
      weight: 30
    - identifier: email
      name: 邮箱
      url: mailto:xuqi86@gmail.com
      weight: 40

params:
  color: linen
  name: Eryk
  bio: "记录学习与思考，主要关注数据科学、机器学习和 Python 开发。"
  description: "Eryk 的技术博客：记录数据科学、机器学习、Python 开发与投资思考。"
  mainSections:
    - posts

  github: xuqi86
  twitter: eryk_xu
  rss: true

  monoDarkIcon: true
  favicon: favicon.ico
  appleTouchIcon: apple-touch-icon.png

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON
