baseURL: "https://erykxu.com/"
languageCode: "zh-CN"
defaultContentLanguage: "zh"
title: "Eryk's Blog"
theme: "paper"
copyright: "© 2017–2026 Eryk"

hasCJKLanguage: true
enableEmoji: true
enableInlineShortcodes: true

buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

# 保持迁移前的文章 URL 不变。
permalinks:
  posts: /:year/:month/:day/:title/

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4

minify:
  disableXML: true
  minifyOutput: true

menu:
  main:
    - identifier: search
      name: 搜索
      url: /search/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 30
    - identifier: about
      name: 关于
      url: /about/
      weight: 40
    - identifier: email
      name: 邮箱
      url: mailto:xuqi86@gmail.com
      weight: 50

params:
  color: linen
  name: Eryk
  bio: "写技术，也写投资、阅读和日常琐想。想到哪里，就记到哪里。"
  description: "Eryk 的个人博客，记录技术实践、投资与阅读，以及日常生活里的想法。"
  mainSections:
    - posts

  github: eryk
  twitter: eryk_xu
  rss: true

  monoDarkIcon: true
  favicon: favicon.ico
  appleTouchIcon: apple-touch-icon.png

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON
